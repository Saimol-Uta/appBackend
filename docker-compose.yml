services:
  postgres:
    image: postgres:16-alpine
    container_name: appbackend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - appbackend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  appbackend-postgres-data: